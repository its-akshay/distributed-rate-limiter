name: Go CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Verify Go Installation
        run: go version

      - name: Download Dependencies
        run: go mod download

      - name: Check Formatting
        run: go fmt ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test ./...
        
      - name: Build Docker Image
        run: docker build -t distributed-rate-limiter .